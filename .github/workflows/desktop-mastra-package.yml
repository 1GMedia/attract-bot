name: Desktop Mastra Package

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/mastra/**'
      - 'apps/shared/**'
      - 'package-lock.json'
      - '.github/workflows/desktop-mastra-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    name: ${{ matrix.os }} packaged runtime
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/retry
        with:
          command: npm ci
      - name: Run Mastra and focused desktop control-plane tests
        run: |
          npm --workspace @hermes/mastra run check
          npm --workspace apps/desktop run typecheck
          npm --workspace apps/desktop run test:mastra-control
      - name: Package Bot desktop without signing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          HERMES_DESKTOP_PRODUCT: bot
          VITE_HERMES_DESKTOP_PRODUCT: bot
        run: |
          npm --workspace @hermes/mastra run build
          npm --workspace apps/desktop run pack
      - name: Smoke packaged Mastra runtime and native dependencies
        run: npm --workspace apps/desktop run smoke:mastra-package
